<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alan Yönetim Sistemi</title>
<link rel="stylesheet" href="css/app.css">
<script>
  (function () {
    try {
      var t = localStorage.getItem("aok-theme-v1") || "light";
      document.documentElement.setAttribute("data-theme", t);
    } catch (e) {}
  })();
</script>
</head>
<body>
<div class="app-shell">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark" id="sidebar-logo">
        <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7Z"/>
          <path d="M19.4 13.5c.1-.5.1-1 0-1.5l1.6-1.2-1.5-2.6-1.9.6a5.7 5.7 0 0 0-1.3-.8l-.3-2H10l-.3 2c-.5.2-.9.5-1.3.8l-1.9-.6-1.5 2.6L6.6 12c-.1.5-.1 1 0 1.5l-1.6 1.2 1.5 2.6 1.9-.6c.4.3.8.6 1.3.8l.3 2h4l.3-2c.5-.2.9-.5 1.3-.8l1.9.6 1.5-2.6-1.6-1.2Z"/>
        </svg>
      </div>
      <div class="brand-text">
        <div class="title">Alan Yönetim Sistemi</div>
        <div class="subtitle" id="sidebar-subtitle">Ali Osman Koç</div>
      </div>
      <button id="theme-toggle-btn" class="theme-toggle-btn no-print" onclick="toggleTheme()" title="Karanlık / Aydınlık Mod">
        <svg id="theme-toggle-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></svg>
      </button>
    </div>
    <div class="school-line" id="sidebar-school-line">Soma Mesleki ve Teknik Anadolu Lisesi<br>Makine Teknolojisi Alanı</div>
    <div class="sidebar-search">
      <input type="text" id="global-search-input" placeholder="Ara: sınıf, öğretmen, öğrenci, makine..." autocomplete="off" oninput="onGlobalSearchInput(this.value)" onkeydown="if(event.key==='Escape'){this.value='';onGlobalSearchInput('');this.blur();}">
      <div id="global-search-results"></div>
    </div>
    <nav id="tabbar"></nav>
    <nav id="subtabbar"></nav>
  </aside>
  <div class="content">
    <main id="main"></main>
  </div>
</div>
<div id="modal-root"></div>
<div id="toast-root" class="no-print"></div>

<script src="js/icons.js"></script>
<script src="js/curriculum-data.js"></script>
<script src="js/ders-bilgi-formu-data.js"></script>
<script src="js/model.js"></script>
<script src="js/scheduler.js"></script>
<script src="js/views.js"></script>
<script src="js/app.js"></script>
</body>
</html>
